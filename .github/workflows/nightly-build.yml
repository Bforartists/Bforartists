name: Nightly Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      c_compiler:
        required: true
        type: string
      cpp_compiler:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      upload:
        required: false
        type: boolean
        default: true
      lite:
        required: false
        type: boolean
        default: false
      test_python:
        required: false
        type: boolean
        default: false
      artifact_suffix:
        required: false
        type: string
        default: ""
    outputs:
      test_verdict:
        value: ${{ jobs.build.outputs.test_verdict }}
      test_log:
        value: ${{ jobs.build.outputs.test_log }}

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    outputs:
      test_verdict: ${{ steps.pytest.outputs.verdict }}
      test_log: ${{ steps.pytest.outputs.log }}

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}

    - name: Use Python 3.13
      if: ${{ runner.os != 'Windows'}}
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "build-type=Release" >> "$GITHUB_OUTPUT"

    - name: Install deps and download libraries (Linux)
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
      run: python ./build_files/linux/install_linux_packages.py

    - name: Use GCC 14 (Linux)
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
          --slave /usr/bin/g++ g++ /usr/bin/g++-14
        gcc --version

    # Safeguard so `make ninja` always finds ninja.
    - name: Install ninja
      run: python -m pip install ninja

    - name: Run make update
      working-directory: ${{ github.workspace }}
      run: python ./build_files/utils/make_update.py

    # ---------------- Windows ----------------
    - name: Build (Windows)
      if: ${{ runner.os == 'Windows'}}
      shell: cmd
      run: make ${{ inputs.lite && 'lite ' || '' }}ninja

    - name: Upload Build (Windows)
      if: ${{ runner.os == 'Windows' && inputs.upload }}
      uses: actions/upload-artifact@v7
      with:
        name: Bforartists-Nightly-${{ runner.os }}-${{ runner.arch }}${{ inputs.artifact_suffix }}
        path: ${{ runner.workspace }}/bfa_build_*/bin
        retention-days: 14

    # ---------------- Linux ----------------
    - name: Build (Linux)
      if: ${{ runner.os == 'Linux'}}
      run: make ${{ inputs.lite && 'lite ' || '' }}ninja

    - name: Upload Build (Linux)
      if: ${{ runner.os == 'Linux' && inputs.upload }}
      uses: actions/upload-artifact@v7
      with:
        name: Bforartists-Nightly-${{ runner.os }}-${{ runner.arch }}${{ inputs.artifact_suffix }}
        path: ${{ runner.workspace }}/bfa_build_*/bin
        retention-days: 14

    # ---------------- MacOS ----------------
    - name: Build (macOS)
      if: ${{ runner.os == 'macOS'}}
      run: make ${{ inputs.lite && 'lite ' || '' }}ninja

    - name: Upload Build (macOS)
      if: ${{ runner.os == 'macOS' && inputs.upload }}
      uses: actions/upload-artifact@v7
      with:
        name: Bforartists-Nightly-${{ runner.os }}-${{ runner.arch }}${{ inputs.artifact_suffix }}
        path: ${{ runner.workspace }}/bfa_build_*/bin
        retention-days: 14

    # ---------------- Python startup test ----------------
    # Runs Bforartists executable with a little bpy script that adds a cube
    - name: Test Python startup
      id: pytest
      if: ${{ inputs.test_python}}
      continue-on-error: true
      shell: bash
      run: |
        python - <<'PY'
        import glob, os, subprocess, sys, tempfile

        ws = os.environ["RUNNER_WORKSPACE"]
        names = {"bforartists", "bforartists.exe", "blender", "blender.exe"}
        exes = []
        for build in sorted(glob.glob(os.path.join(ws, "bfa_build_*"))):
            for root, _, files in os.walk(os.path.join(build, "bin")):
                exes += [os.path.join(root, f) for f in files if f.lower() in names]

        def publish(verdict, tail):
            out = os.environ.get("GITHUB_OUTPUT")
            if out:
                with open(out, "a") as o:
                    o.write(f"verdict={verdict}\n")
                    o.write(f"log<<BFA_EOF\n{tail}\nBFA_EOF\n")
            summary = os.environ.get("GITHUB_STEP_SUMMARY")
            if summary:
                with open(summary, "a") as s:
                    s.write(f"### Python startup test\n**{verdict}**\n\n```\n{tail}\n```\n")

        if not exes:
            listing = "\n".join(glob.glob(os.path.join(ws, "bfa_build_*", "bin", "*")))
            print("FAIL: no executable found\n" + listing)
            publish("FAIL: no executable found under bin", listing[-3000:])
            sys.exit(0)
        exe = exes[0]
        print("Executable:", exe)

        test_py = os.path.join(tempfile.gettempdir(), "bfa_ci_test.py")
        with open(test_py, "w") as f:
            f.write(
                "import bpy\n"
                "print('TEST: version', bpy.app.version_string)\n"
                "before = len(bpy.data.objects)\n"
                "bpy.ops.mesh.primitive_cube_add()\n"
                "obj = bpy.context.active_object\n"
                "assert obj is not None and obj.type == 'MESH', 'cube was not created'\n"
                "assert len(bpy.data.objects) == before + 1, 'object count did not change by one'\n"
                "print('TEST: objects', before, '->', len(bpy.data.objects))\n"
                "print('TEST: OK')\n"
            )

        cmd = [exe, "--background", "--factory-startup",
               "--python-exit-code", "1", "--python", test_py]
        try:
            p = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                               text=True, errors="replace", timeout=300)
            rc, log = p.returncode, p.stdout
        except subprocess.TimeoutExpired as e:
            rc = None
            log = e.stdout.decode(errors="replace") if isinstance(e.stdout, bytes) else (e.stdout or "")

        if rc == 0:
            verdict = "PASS: started, ran the Python test, exited cleanly"
        elif rc is None:
            verdict = "FAIL: hung, killed after 300 s"
        elif rc == 1:
            verdict = "FAIL: started, but the Python test raised an error (exit 1)"
        else:
            verdict = f"FAIL: CRASH, abnormal exit code {rc}"

        print("::group::Console log")
        print(log)
        print("::endgroup::")
        for crash in glob.glob(os.path.join(tempfile.gettempdir(), "*.crash.txt")):
            print(f"::group::{crash}")
            print(open(crash, errors="replace").read())
            print("::endgroup::")
        print(verdict)

        lines = log.replace("\r", "").splitlines()
        if rc == 0:
            tail = "\n".join(l for l in lines if l.startswith("TEST:"))
        else:
            tail = "\n".join(lines[-60:])[-6000:]

        publish(verdict, tail)
        if rc != 0:
            print(f"::warning title=Python startup test::{verdict}")
        sys.exit(0)
        PY
